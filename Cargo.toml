[package]
name = "lumenprint"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Scaffolding CLI that generates known-good Stellar/Soroban smart contract projects from templates"
repository = "https://github.com/LumenAnvil/lumenprint"
license = "Apache-2.0"
readme = "README.md"
keywords = ["stellar", "soroban", "scaffold", "smart-contracts", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/scripts"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
